<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Asistencia Seguro Automóviles · SDI</title>

  <!-- Sora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React y ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --navy:       #0c2340;
      --navy-soft:  #143055;
      --blue:       #0369a1;
      --blue-light: #0ea5e9;
      --blue-50:    #f0f9ff;
      --green:      #16a34a;
      --green-dark: #15803d;
      --green-50:   #f0fdf4;
      --amber:      #d97706;
      --amber-50:   #fffbeb;
      --red:        #dc2626;
      --red-dark:   #991b1b;
      --red-50:     #fef2f2;
      --purple-50:  #faf5ff;
      --teal-50:    #f0fdfa;

      --gray-50:    #f9fafb;
      --gray-100:   #f3f4f6;
      --gray-200:   #e5e7eb;
      --gray-300:   #d1d5db;
      --gray-500:   #6b7280;
      --gray-700:   #374151;
      --gray-900:   #111827;

      --shadow-sm:  0 1px 2px rgba(0,0,0,.05);
      --shadow-md:  0 4px 8px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg:  0 12px 24px rgba(12,35,64,.12), 0 2px 6px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--gray-900);
      background: var(--gray-50);
      min-height: 100vh;
    }

    /* ============ HEADER ============ */
    .app-header {
      position: sticky; top: 0; z-index: 40;
      background: var(--navy);
      color: #fff;
      box-shadow: var(--shadow-md);
    }
    .header-inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 16px;
    }
    .header-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .brand-logo-ins {
      height: 32px; width: auto;
      flex-shrink: 0;
      object-fit: contain;
    }
    .brand-logo-ins-fallback {
      height: 32px; min-width: 56px;
      border-radius: 6px;
      border: 1.5px solid #fff;
      display: grid; place-items: center;
      font-weight: 800; font-size: 14px;
      letter-spacing: 1.5px;
      color: #fff;
      flex-shrink: 0;
    }
    .brand-text { min-width: 0; }
    .brand-title { font-size: 13px; font-weight: 700; letter-spacing: .2px; line-height: 1.15; }
    .brand-subtitle { font-size: 10px; opacity: .7; margin-top: 2px; letter-spacing: .3px; }

    .header-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: rgba(255,255,255,.10);
      color: #fff;
      border: 0;
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    .header-btn:hover { background: rgba(255,255,255,.18); }
    .header-btn i { font-size: 16px; }
    .header-actions { display: flex; gap: 8px; }

    .agent-strip {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.12);
      font-size: 11px;
      color: rgba(255,255,255,.78);
      text-align: center;
      letter-spacing: .2px;
    }
    .agent-strip strong { color: #fff; font-weight: 600; }

    .back-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: rgba(255,255,255,.10);
      color: #fff; border: 0;
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,.18); }

    /* ============ MAIN ============ */
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero-card {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 1px solid #bfdbfe;
      border-left: 4px solid var(--blue);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .hero-card h2 {
      font-size: 15px; font-weight: 700; color: var(--navy);
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 4px;
    }
    .hero-card p { font-size: 13px; color: #1e3a5f; margin: 0; line-height: 1.5; }

    .action-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; gap: 14px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      width: 100%;
      text-align: left;
    }
    .action-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .action-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .action-icon i { font-size: 20px; }
    .action-icon.red { background: #fee2e2; color: var(--red-dark); }
    .action-icon.amber { background: #ffedd5; color: #9a3412; }
    .action-icon.purple { background: #f3e8ff; color: #6b21a8; }
    .action-icon.teal { background: #ccfbf1; color: #115e59; }
    .action-icon.green { background: #dcfce7; color: var(--green-dark); }
    .action-text h3 { font-size: 14px; font-weight: 700; color: var(--gray-900); margin: 0 0 2px; }
    .action-text p { font-size: 12px; color: var(--gray-500); margin: 0; line-height: 1.4; }

    /* ============ SECTION CARDS ============ */
    .section-card {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .section-card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--gray-100);
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .section-card-header.red    { background: var(--red-50);    color: var(--red-dark); }
    .section-card-header.blue   { background: var(--blue-50);   color: var(--navy); }
    .section-card-header.amber  { background: var(--amber-50);  color: #92400e; }
    .section-card-header.purple { background: var(--purple-50); color: #6b21a8; }
    .section-card-header.teal   { background: var(--teal-50);   color: #115e59; }
    .section-card-header.gray   { background: var(--gray-50);   color: var(--gray-700); }
    .section-card-body { padding: 14px 16px; font-size: 13px; color: var(--gray-700); line-height: 1.55; }

    /* ============ EMERGENCY BUTTON ============ */
    .btn-emergency {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(22,163,74,.32), 0 1px 3px rgba(0,0,0,.08);
      transition: transform .12s, box-shadow .12s;
    }
    .btn-emergency:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(22,163,74,.4); }

    /* ============ AGENT CARD (en directorio) ============ */
    .agent-card {
      background: linear-gradient(135deg, #0c2340 0%, #143055 60%, #0369a1 100%);
      color: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 28px rgba(12,35,64,.28);
      position: relative;
      overflow: hidden;
    }
    .agent-card::after {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(14,165,233,.35) 0%, transparent 70%);
      pointer-events: none;
    }
    .agent-card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 6px;
    }
    .agent-card-name {
      font-size: 18px; font-weight: 700;
      line-height: 1.25; margin-bottom: 4px;
    }
    .agent-card-meta {
      font-size: 12px; color: rgba(255,255,255,.78);
      margin-bottom: 14px;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .agent-card-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .agent-card-actions {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .agent-action-btn {
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      border-radius: 10px;
      padding: 10px 6px;
      font-size: 11px; font-weight: 600;
      text-align: center;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background .15s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .agent-action-btn:hover { background: rgba(255,255,255,.24); }
    .agent-action-btn i { font-size: 16px; }
    .agent-action-btn.wa  { background: linear-gradient(180deg, #25d366 0%, #1da851 100%); border-color: transparent; }
    .agent-action-btn.wa:hover { background: linear-gradient(180deg, #2ee07a 0%, #1da851 100%); }

    /* ============ CONTACT TILE (INS) ============ */
    .contact-tile {
      display: flex; align-items: center; justify-content: space-between;
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: background .12s, border-color .12s;
    }
    .contact-tile:hover { background: var(--gray-50); border-color: var(--gray-300); }
    .contact-tile h4 { margin: 0 0 2px; font-size: 14px; font-weight: 700; color: var(--gray-900); }
    .contact-tile p  { margin: 0; font-size: 11px; color: var(--gray-500); }
    .contact-pill {
      background: #dcfce7; color: var(--green-dark);
      padding: 6px 12px; border-radius: 10px;
      font-weight: 700; font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    /* ============ FOOTER ============ */
    .app-footer {
      margin-top: 32px;
      background: var(--navy);
      color: #cbd5e1;
      padding: 22px 16px 28px;
      text-align: center;
      font-size: 12px;
    }
    .footer-sdi-logo {
      height: 56px; width: auto;
      display: block;
      margin: 0 auto 16px;
      opacity: .95;
    }
    .footer-agent {
      background: rgba(14,165,233,.08);
      border: 1px solid rgba(14,165,233,.22);
      border-radius: 12px;
      padding: 12px 14px;
      max-width: 360px;
      margin: 0 auto 14px;
    }
    .footer-agent .label {
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      color: #7dd3fc; font-weight: 600; margin-bottom: 4px;
    }
    .footer-agent .name { color: #fff; font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .footer-agent .meta { color: #cbd5e1; font-size: 11px; }
    .footer-brand { color: #fff; font-weight: 700; }
    .footer-link { color: #7dd3fc; font-weight: 600; text-decoration: none; }
    .footer-link:hover { text-decoration: underline; }
    .footer-legal {
      margin-top: 14px; padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.10);
      font-size: 10px; color: #94a3b8; line-height: 1.5;
      max-width: 360px; margin-left: auto; margin-right: auto;
    }

    /* ============ MODAL ============ */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(12,35,64,.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      padding: 0;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 600px) {
      .modal-backdrop { align-items: center; padding: 24px; }
    }
    .modal-card {
      background: #fff;
      border-radius: 18px 18px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      display: flex; flex-direction: column;
      box-shadow: 0 -8px 32px rgba(0,0,0,.18);
    }
    @media (min-width: 600px) {
      .modal-card { border-radius: 18px; }
    }
    .modal-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--gray-100);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--navy); margin: 0; }
    .modal-close {
      background: var(--gray-100); border: 0;
      width: 32px; height: 32px;
      border-radius: 8px;
      font-size: 18px; color: var(--gray-700);
      cursor: pointer;
    }
    .modal-close:disabled { opacity: .25; cursor: not-allowed; }
    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-hint {
      font-size: 12px; color: var(--gray-500);
      margin: 0 0 14px; line-height: 1.5;
    }
    .form-row { margin-bottom: 12px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--gray-700); margin-bottom: 5px;
    }
    .form-label.required::after { content: ' *'; color: var(--red); }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--gray-900);
      background: #fff;
    }
    .form-control:focus { outline: 2px solid var(--blue-light); outline-offset: 1px; border-color: var(--blue); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-info {
      background: var(--blue-50);
      border-left: 3px solid var(--blue);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #1e3a5f;
      line-height: 1.5;
      margin-top: 8px;
    }
    .modal-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--gray-100);
      display: flex; gap: 10px; justify-content: flex-end;
      flex-shrink: 0;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: 0;
      font-family: inherit;
    }
    .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
    .btn-secondary:hover { background: var(--gray-200); }
    .btn-secondary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(180deg, var(--blue) 0%, #075985 100%);
      color: #fff;
      box-shadow: 0 4px 12px rgba(3,105,161,.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 18px rgba(3,105,161,.4); }

    /* ============ HELPERS ============ */
    .text-tabular { font-variant-numeric: tabular-nums; }
    .check-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .check-item i { color: var(--green); margin-top: 3px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ---------- PERFIL DEL AGENTE (localStorage multi-tenant) ----------
    const PROFILE_KEY = 'app_asistencia_agent_v1';
    const EMPTY_PROFILE = {
      name: '', email: '', phone: '', whatsapp: '', license: '', website: ''
    };

    function loadProfile() {
      try {
        const raw = localStorage.getItem(PROFILE_KEY);
        if (!raw) return null;
        const p = JSON.parse(raw);
        if (!p || !p.name || !p.email || !p.phone || !p.license) return null;
        return { ...EMPTY_PROFILE, ...p };
      } catch (e) { return null; }
    }

    function saveProfileToStorage(p) {
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify({
          name:     (p.name     || '').trim(),
          email:    (p.email    || '').trim(),
          phone:    (p.phone    || '').trim(),
          whatsapp: (p.whatsapp || '').trim(),
          license:  (p.license  || '').trim(),
          website:  (p.website  || '').trim()
        }));
        return true;
      } catch (e) {
        alert('No se pudo guardar el perfil. Verifica que el navegador permita localStorage.');
        return false;
      }
    }

    function clearProfileFromStorage() {
      try { localStorage.removeItem(PROFILE_KEY); } catch (e) {}
    }

    const BRAND = {
      empresa: 'Seguros Digitales SDI®',
      legal: '© 2026 Propiedad Intelectual de Juan Carlos Hernández Vargas. Todos los derechos reservados.'
    };

    function App() {
      const [view, setView] = useState('home');
      const [profile, setProfile] = useState(EMPTY_PROFILE);
      const [hasProfile, setHasProfile] = useState(false);
      const [modalOpen, setModalOpen] = useState(false);
      const [form, setForm] = useState(EMPTY_PROFILE);

      useEffect(() => {
        const p = loadProfile();
        if (p) {
          setProfile(p);
          setHasProfile(true);
        } else {
          setForm(EMPTY_PROFILE);
          setModalOpen(true);
        }
      }, []);

      const openModal = () => { setForm(profile); setModalOpen(true); };
      const closeModal = () => { if (hasProfile) setModalOpen(false); };
      const saveProfile = () => {
        const required = ['name','email','phone','license'];
        const missing = required.filter(k => !form[k] || !String(form[k]).trim());
        if (missing.length > 0) {
          alert('Faltan campos obligatorios: ' + missing.join(', '));
          return;
        }
        if (saveProfileToStorage(form)) {
          setProfile({ ...EMPTY_PROFILE, ...form });
          setHasProfile(true);
          setModalOpen(false);
        }
      };
      const handleClearProfile = () => {
        if (!confirm('¿Borrar perfil del agente de este dispositivo? Tendrás que volver a configurarlo.')) return;
        clearProfileFromStorage();
        setProfile(EMPTY_PROFILE);
        setForm(EMPTY_PROFILE);
        setHasProfile(false);
        setModalOpen(true);
      };

      const titleByView = {
        home:       'Asistencia Seguro Automóviles',
        accidente:  'Reporte de Accidente',
        vial:       'Asistencia Vial',
        robo:       'Robo Total / Parcial',
        coberturaH: 'Vandalismo / Naturaleza',
        contactos:  'Directorio de Contactos'
      };

      const waNumber = (profile.whatsapp || profile.phone || '').replace(/\D/g,'');
      const waLink = waNumber ? `https://wa.me/${waNumber}` : null;

      return (
        <div className="flex flex-col min-h-screen">
          <header className="app-header">
            <div className="header-inner">
              <div className="header-row">
                {view === 'home' ? (
                  <div className="brand">
                    <img src="ins-blanco.png" alt="INS"
                         className="brand-logo-ins"
                         onError={(e) => { e.target.style.display='none'; e.target.nextElementSibling.style.display='grid'; }} />
                    <div className="brand-logo-ins-fallback" style={{display:'none'}}>INS</div>
                    <div className="brand-text">
                      <div className="brand-title">Asistencia Autos</div>
                      <div className="brand-subtitle">Instituto Nacional de Seguros</div>
                    </div>
                  </div>
                ) : (
                  <button className="back-btn" onClick={() => setView('home')} title="Volver">
                    <i className="fa-solid fa-chevron-left"></i>
                  </button>
                )}
                {view !== 'home' && (
                  <div className="brand-text" style={{flex:1, textAlign:'center'}}>
                    <div className="brand-title">{titleByView[view]}</div>
                  </div>
                )}
                <div className="header-actions">
                  <button className="header-btn" onClick={() => setView('contactos')} title="Contactos">
                    <i className="fa-solid fa-phone"></i>
                  </button>
                  <button className="header-btn" onClick={openModal} title="Configurar agente">
                    <i className="fa-solid fa-gear"></i>
                  </button>
                </div>
              </div>
              {hasProfile && (
                <div className="agent-strip">
                  Tu agente: <strong>{profile.name}</strong> · Licencia {profile.license}
                </div>
              )}
            </div>
          </header>

          <main className="flex-1">
            {view === 'home' && <Home setView={setView} />}
            {view === 'accidente' && <Accidente />}
            {view === 'vial' && <Vial />}
            {view === 'robo' && <Robo />}
            {view === 'coberturaH' && <CoberturaH />}
            {view === 'contactos' && <Contactos profile={profile} waLink={waLink} hasProfile={hasProfile} openModal={openModal} />}
          </main>

          <footer className="app-footer">
            <img src="sdi-logo-blanco.svg" alt="Seguros Digitales SDI" className="footer-sdi-logo" />
            {hasProfile && (
              <div className="footer-agent">
                <div className="label">Tu agente</div>
                <div className="name">{profile.name}</div>
                <div className="meta">Licencia {profile.license} · {profile.email}</div>
                {profile.website && (
                  <div style={{marginTop:6}}>
                    <a href={profile.website.startsWith('http') ? profile.website : `https://${profile.website}`}
                       className="footer-link" target="_blank" rel="noopener noreferrer">
                      <i className="fa-solid fa-globe" style={{marginRight:5}}></i>{profile.website}
                    </a>
                  </div>
                )}
              </div>
            )}
            <p style={{margin:'0 0 6px'}}>Plataforma de <span className="footer-brand">{BRAND.empresa}</span></p>
            <div className="footer-legal">{BRAND.legal}</div>
          </footer>

          {/* MODAL */}
          <div className={`modal-backdrop ${modalOpen ? 'open' : ''}`}>
            <div className="modal-card">
              <div className="modal-header">
                <h2 className="modal-title">Configuración del agente</h2>
                {hasProfile && (
                  <button className="modal-close" onClick={closeModal} aria-label="Cerrar">×</button>
                )}
              </div>
              <div className="modal-body">
                <p className="modal-hint">
                  {hasProfile
                    ? 'Personaliza tus datos como agente. Aparecerán en el encabezado, el pie de página y el Directorio de Contactos.'
                    : 'Antes de usar la app, configura tus datos como agente. Aparecerán en el encabezado, el pie de página y el Directorio de Contactos.'}
                </p>

                <div className="form-row">
                  <label className="form-label required">Nombre completo</label>
                  <input className="form-control" value={form.name}
                    onChange={(e) => setForm({...form, name: e.target.value})}
                    placeholder="Ej: Juan Carlos Hernandez Vargas" />
                </div>

                <div className="form-row">
                  <label className="form-label required">Correo</label>
                  <input className="form-control" type="email" value={form.email}
                    onChange={(e) => setForm({...form, email: e.target.value})}
                    placeholder="tu@dominio.com" />
                </div>

                <div className="grid-2">
                  <div className="form-row">
                    <label className="form-label required">Teléfono</label>
                    <input className="form-control" value={form.phone}
                      onChange={(e) => setForm({...form, phone: e.target.value})}
                      placeholder="8888-8888" />
                  </div>
                  <div className="form-row">
                    <label className="form-label">WhatsApp</label>
                    <input className="form-control" value={form.whatsapp}
                      onChange={(e) => setForm({...form, whatsapp: e.target.value})}
                      placeholder="50688888888" />
                  </div>
                </div>

                <div className="form-row">
                  <label className="form-label required">Licencia SUGESE</label>
                  <input className="form-control" value={form.license}
                    onChange={(e) => setForm({...form, license: e.target.value})}
                    placeholder="00-0000" />
                </div>

                <div className="form-row">
                  <label className="form-label">Sitio web (opcional)</label>
                  <input className="form-control" value={form.website}
                    onChange={(e) => setForm({...form, website: e.target.value})}
                    placeholder="www.misitio.com" />
                </div>

                <div className="modal-info">
                  <strong>Privacidad:</strong> tus datos se guardan solo en este navegador (localStorage). No se envían a ningún servidor. Si limpias el caché del navegador deberás volver a configurarlos.
                </div>
              </div>
              <div className="modal-footer">
                {hasProfile && (
                  <button className="btn btn-secondary" onClick={handleClearProfile} style={{marginRight:'auto'}}>
                    Borrar
                  </button>
                )}
                {hasProfile && (
                  <button className="btn btn-secondary" onClick={closeModal}>Cancelar</button>
                )}
                <button className="btn btn-primary" onClick={saveProfile}>Guardar perfil</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Home({ setView }) {
      return (

          <div className="hero-card">
            <h2><i className="fa-solid fa-shield-halved"></i> ¿Tienes una emergencia?</h2>
            <p>Selecciona el tipo de asistencia que necesitas en el territorio nacional para guiarte paso a paso.</p>
          </div>

          <button className="action-card" onClick={() => setView('accidente')}>
            <div className="action-icon red"><i className="fa-solid fa-car-burst"></i></div>
            <div className="action-text">
              <h3>Accidente de Tránsito</h3>
              <p>Choques y guía para el Pacto Amistoso.</p>
            </div>
          </button>

          <button className="action-card" onClick={() => setView('vial')}>
            <div className="action-icon amber"><i className="fa-solid fa-screwdriver-wrench"></i></div>
            <div className="action-text">
              <h3>Asistencia Vial (Avería)</h3>
              <p>Grúa, cerrajería, batería, llanta o aeropuerto.</p>
            </div>
          </button>

          <button className="action-card" onClick={() => setView('robo')}>
            <div className="action-icon purple"><i className="fa-solid fa-shield"></i></div>
            <div className="action-text">
              <h3>Robo Total o Parcial</h3>
              <p>Denuncia ante OIJ, traslados y trámites con el INS.</p>
            </div>
          </button>

          <button className="action-card" onClick={() => setView('coberturaH')}>
            <div className="action-icon teal"><i className="fa-solid fa-cloud-showers-heavy"></i></div>
            <div className="action-text">
              <h3>Vandalismo / Cobertura H</h3>
              <p>Rayonazos, inundaciones, huracanes, caída de árboles.</p>
            </div>
          </button>

          <button className="action-card" onClick={() => setView('contactos')}>
            <div className="action-icon green"><i className="fa-solid fa-phone"></i></div>
            <div className="action-text">
              <h3>Directorio de Contactos</h3>
              <p>Tu agente y los números directos 24/7 del INS.</p>
            </div>
          </button>
        </div>
      );
    }

    function Accidente() {
      return (
        <div className="container">
          <div className="section-card">
            <div className="section-card-header red">
              <i className="fa-solid fa-triangle-exclamation"></i> Paso 1: Reporte Inmediato
            </div>
            <div className="section-card-body">
              <p style={{margin:'0 0 12px'}}>Si tuviste un choque, <strong>¡NO muevas el vehículo!</strong> (a menos que aplique Pacto Amistoso). Llama de inmediato:</p>
              <a href="tel:8008008000" className="btn-emergency">800-800-8000 · Reporte Accidente</a>
            </div>
          </div>

          <div className="section-card">
            <div className="section-card-header blue">
              <i className="fa-solid fa-shield-halved"></i> ¿Aplica Pacto Amistoso?
            </div>
            <div className="section-card-body">
              <p style={{margin:'0 0 10px', color:'var(--gray-700)'}}>Puedes mover el vehículo sin esperar al Tránsito SI se cumplen <strong>TODAS</strong>:</p>
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span>Ambos conductores <strong>están de acuerdo</strong> en hacer el arreglo.</span></div>
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span>No hay lesionados ni fallecidos.</span></div>
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span>No hay bicicletas, motos ni peatones involucrados.</span></div>
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span>Ambos vehículos están asegurados y al día.</span></div>
            </div>
          </div>

          <div className="section-card">
            <div className="section-card-header gray">
              <i className="fa-solid fa-clock"></i> Trámites Posteriores
            </div>
            <div className="section-card-body">
              <p style={{margin:'0 0 8px'}}><strong>7 días hábiles</strong> para formalizar el aviso por escrito si no pudiste llamar al momento.</p>
              <p style={{margin:0}}><strong>10 días hábiles</strong> para llevar el vehículo a un Centro de Estimación de Daños (CED).</p>
            </div>
          </div>
        </div>
      );
    }

    function Vial() {
      return (
        <div className="container">
          <div className="section-card">
            <div className="section-card-header amber">
              <i className="fa-solid fa-screwdriver-wrench"></i> Solicitar Asistencia
            </div>
            <div className="section-card-body">
              <p style={{margin:'0 0 12px'}}>Si tu vehículo sufrió una avería mecánica, solicita asistencia:</p>
              <a href="tel:8008008001" className="btn-emergency">800-800-8001 · Multiasistencia</a>
            </div>
          </div>

          <div className="section-card">
            <div className="section-card-header gray">
              <i className="fa-solid fa-list-check"></i> Servicios Disponibles
            </div>
            <div className="section-card-body">
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span><strong>Remolque y Básicos:</strong> grúa por avería, combustible, llanta estallada, paso de corriente y cerrajería.</span></div>
              <div className="check-item"><i className="fa-solid fa-plane" style={{color:'var(--blue)'}}></i><span><strong>Taxi al Aeropuerto:</strong> 2 traslados al año (ida y regreso). Vehículos hasta 6 años.</span></div>
              <p style={{fontSize:11, color:'var(--gray-500)', marginTop:12, fontStyle:'italic'}}>* Límites de eventos y distancias dependen del plan (Limitado, Básico o Plus).</p>
            </div>
          </div>
        </div>
      );
    }

    function Robo() {
      return (
        <div className="container">
          <div className="section-card">
            <div className="section-card-header purple">
              <i className="fa-solid fa-shield"></i> Paso 1: Denuncia Inmediata
            </div>
            <div className="section-card-body">
              <p style={{margin:'0 0 12px'}}>Presenta la denuncia <strong>inmediatamente</strong> ante OIJ y reporta al INS:</p>
              <a href="tel:911" className="btn-emergency" style={{background:'linear-gradient(180deg,#1f2937,#111827)', boxShadow:'0 4px 12px rgba(0,0,0,.3)', marginBottom:10}}>911 · OIJ</a>
              <a href="tel:8008008000" className="btn-emergency">800-800-8000 · Reporte INS</a>
            </div>
          </div>

          <div className="section-card">
            <div className="section-card-header gray">En caso de Robo Total</div>
            <div className="section-card-body">
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span><strong>Transporte:</strong> llama al 800-800-8001 para taxi al OIJ y luego a tu residencia.</span></div>
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span><strong>Trámite INS:</strong> 15 días hábiles después de la denuncia, presenta certificación del OIJ.</span></div>

          <div className="section-card">
            <div className="section-card-header gray">En caso de Robo Parcial</div>
            <div className="section-card-body">
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span>Si tiene GPS/monitoreo, comprueba que estaba activo al momento del robo.</span></div>
              <div className="check-item"><i className="fa-solid fa-circle-check"></i><span>Si el vehículo aparece antes del pago, solicita inspección ocular del OIJ.</span></div>
            </div>
          </div>
        </div>
      );
    }

    function CoberturaH() {
      return (
        <div className="container">
          <div className="section-card">
            <div className="section-card-header teal">
              <i className="fa-solid fa-cloud-showers-heavy"></i> ¿Qué incluye la Cobertura H?
            </div>
            <div className="section-card-body">
              <p style={{margin:'0 0 8px'}}><strong>Vandalismo:</strong> rayonazos, raspones, sustancias corrosivas, pintura.</p>
              <p style={{margin:'0 0 8px'}}><strong>Naturaleza:</strong> inundación, ciclón, huracán, temblor, deslizamiento.</p>
              <p style={{margin:0}}><strong>Otros:</strong> caída de árboles, explosión, incendio.</p>
            </div>
          </div>

          <div className="section-card">
            <div className="section-card-header red">
              <i className="fa-solid fa-triangle-exclamation"></i> Reporte de Daños
            </div>
            <div className="section-card-body">
              <p style={{margin:'0 0 12px'}}><strong>No repares ni alteres los daños.</strong> Reporta el evento de inmediato:</p>
              <a href="tel:8008008000" className="btn-emergency">800-800-8000 · Reporte INS</a>
            </div>
          </div>

          <div className="section-card">
            <div className="section-card-header gray">Trámites Posteriores</div>
            <div className="section-card-body">
              <p style={{margin:'0 0 8px'}}><strong>Cooperación:</strong> en vandalismo, el INS puede pedir colaboración adicional para la investigación.</p>
              <p style={{margin:0}}><strong>10 días hábiles</strong> para llevar el vehículo al Centro de Estimación de Daños (CED).</p>
            </div>
          </div>
        </div>
      );
    }

    function Contactos({ profile, waLink, hasProfile, openModal }) {
      return (
        <div className="container">
          {hasProfile ? (
            <div className="agent-card">
              <div className="agent-card-label">Tu agente de seguros</div>
              <div className="agent-card-name">{profile.name}</div>
              <div className="agent-card-meta">
                <span><i className="fa-solid fa-id-badge"></i> Licencia {profile.license}</span>
              </div>
              <div className="agent-card-actions">
                <a href={`tel:${profile.phone.replace(/\D/g,'')}`} className="agent-action-btn">
                  <i className="fa-solid fa-phone"></i>
                  <span>Llamar</span>
                </a>
                {waLink ? (
                  <a href={waLink} className="agent-action-btn wa" target="_blank" rel="noopener noreferrer">
                    <i className="fa-brands fa-whatsapp"></i>
                    <span>WhatsApp</span>
                  </a>
                ) : (
                  <a href={`tel:${profile.phone.replace(/\D/g,'')}`} className="agent-action-btn">
                    <i className="fa-solid fa-phone"></i>
                    <span>Llamar</span>
                  </a>
                )}
                <a href={`mailto:${profile.email}`} className="agent-action-btn">
                  <i className="fa-solid fa-envelope"></i>
                  <span>Correo</span>
                </a>
              </div>
            </div>
          ) : (
            <button onClick={openModal} className="agent-card" style={{cursor:'pointer', border:0, width:'100%', textAlign:'left'}}>
              <div className="agent-card-label">Configura tu información</div>
              <div className="agent-card-name" style={{fontSize:16, marginBottom:8}}>Aún no has configurado tu perfil</div>
              <div style={{fontSize:12, color:'rgba(255,255,255,.85)', display:'flex', alignItems:'center', gap:6}}>
                <i className="fa-solid fa-gear"></i> Toca para abrir la configuración del agente
              </div>
            </button>
          )}

          <h3 style={{fontSize:13, fontWeight:700, color:'var(--gray-500)', letterSpacing:1.5, textTransform:'uppercase', margin:'4px 4px 10px'}}>
            Líneas oficiales INS
          </h3>

          <a href="tel:8008008000" className="contact-tile">
            <div>
              <h4>Reporte de Accidentes</h4>
              <p>Choques / Daños · 24/7</p>
            </div>
            <span className="contact-pill">800-800-8000</span>
          </a>

          <a href="tel:8008008001" className="contact-tile">
            <div>
              <h4>Asistencia Vial</h4>
              <p>Grúa, batería, cerrajero</p>
            </div>
            <span className="contact-pill">800-800-8001</span>
          </a>

          <a href="tel:8008353467" className="contact-tile">
            <div>
              <h4>Consultas Generales</h4>
              <p>Línea Teleins</p>
            </div>
            <span className="contact-pill">800-8353467</span>
          </a>

          <div style={{marginTop:18, background:'var(--gray-50)', border:'1px solid var(--gray-200)', borderRadius:12, padding:14, textAlign:'center', fontSize:12, color:'var(--gray-700)'}}>
            <i className="fa-solid fa-location-dot" style={{fontSize:22, color:'var(--gray-500)', marginBottom:6}}></i>
            <p style={{margin:'0 0 6px'}}><strong>Oficinas Centrales INS</strong><br/>Calle 9 y 11, Av. 7, San José, CR</p>
            <a href="mailto:contactenos@grupoins.com" style={{color:'var(--blue)', fontWeight:600, textDecoration:'none'}}>contactenos@grupoins.com</a>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
