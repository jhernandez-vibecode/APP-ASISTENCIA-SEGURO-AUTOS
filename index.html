<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0c2340">

  <title>Asistencia Seguro Automóviles · SDI</title>

  <!-- Sora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React y ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root{
      --navy:#0c2340; --navy-2:#143055;
      --ink:#1a2230; --muted:#5b6675; --faint:#8a93a0;
      --line:#e9ebef; --line-2:#f0f2f5;
      --paper:#fbfbfa; --card:#ffffff;
      --accent:#0369a1; --accent-soft:#eef6fb;
      --red:#c2342f; --red-dark:#9f2722; --red-soft:#fbeeed;
      --amber:#b4690e; --amber-soft:#fdf3e7;
      --violet:#5b4b8a; --violet-soft:#f1eef8;
      --teal:#0f6f63; --teal-soft:#e7f4f1;
      --green:#157347; --green-dark:#0f5c38;

      --shadow-card:0 14px 30px -20px rgba(12,35,64,.18);
      --shadow-pop:0 16px 30px -12px rgba(12,35,64,.28);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;}
    body{
      font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      color:var(--ink); background:var(--paper); min-height:100dvh;
    }
    .app{display:flex;flex-direction:column;min-height:100dvh;max-width:480px;margin:0 auto;background:var(--paper);}

    /* ============ HEADER ============ */
    .app-header{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;}
    .header-inner{padding:16px 20px 18px;}
    .header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .brand{display:flex;align-items:center;gap:11px;min-width:0;}
    .brand-logo{height:30px;width:auto;object-fit:contain;flex-shrink:0;}
    .brand-fallback{height:30px;min-width:52px;border:1.5px solid #fff;border-radius:6px;
        display:grid;place-items:center;font-weight:800;letter-spacing:1.5px;font-size:13px;color:#fff;flex-shrink:0;}
    .brand-text{min-width:0;}
    .brand-t1{font-size:12.5px;font-weight:700;line-height:1.1;}
    .brand-t2{font-size:9.5px;opacity:.62;letter-spacing:.3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    .hbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:0;color:#fff;
        display:grid;place-items:center;font-size:14px;cursor:pointer;transition:background .15s;flex-shrink:0;}
    .hbtn:hover{background:rgba(255,255,255,.2);}
    .back-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;border:0;
        display:grid;place-items:center;font-size:15px;cursor:pointer;transition:background .15s;flex-shrink:0;}
    .back-btn:hover{background:rgba(255,255,255,.2);}
    .detail-title{flex:1;text-align:center;font-size:14px;font-weight:700;line-height:1.2;padding:0 6px;}

    .greet{margin-top:20px;}
    .greet .k{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7fb0db;font-weight:600;}
    .greet h1{margin:7px 0 0;font-size:25px;line-height:1.1;font-weight:700;letter-spacing:-.5px;}
    .greet p{margin:8px 0 0;font-size:13px;line-height:1.5;color:#b9c8da;max-width:32ch;}

    .agent-chip{display:flex;align-items:center;gap:11px;margin-top:18px;padding:11px 13px;width:100%;text-align:left;cursor:pointer;
        background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;color:#fff;transition:background .15s;}
    .agent-chip:hover{background:rgba(255,255,255,.12);}
    .agent-chip .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#0369a1);
        display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;color:#fff;}
    .agent-chip .n{font-size:12.5px;font-weight:600;line-height:1.2;}
    .agent-chip .m{font-size:10.5px;color:#9fb4c9;margin-top:2px;}
    .agent-chip .go{margin-left:auto;color:#7fb0db;font-size:13px;flex-shrink:0;}

    /* ============ MAIN ============ */
    main{flex:1;}
    .container{padding:20px 20px 8px;}
    .lbl{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint);font-weight:600;margin:4px 4px 8px;}

    /* SOS banner */
    .sos{display:flex;align-items:center;gap:14px;width:100%;border:0;cursor:pointer;text-align:left;
        background:linear-gradient(180deg,var(--red),var(--red-dark));color:#fff;border-radius:18px;padding:16px 18px;
        box-shadow:0 12px 24px -8px rgba(194,52,47,.5);margin-bottom:22px;transition:transform .12s,box-shadow .12s;}
    .sos:hover{transform:translateY(-1px);box-shadow:0 16px 30px -8px rgba(194,52,47,.55);}
    .sos:active{transform:scale(.99);}
    .sos .ic{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:20px;flex-shrink:0;}
    .sos .ttl{font-size:15px;font-weight:700;}
    .sos .sub{font-size:11.5px;opacity:.85;margin-top:2px;}
    .sos .num{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
        background:rgba(255,255,255,.16);padding:6px 10px;border-radius:9px;flex-shrink:0;}

    /* divided action list */
    .list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-card);}
    .row{display:flex;align-items:center;gap:15px;width:100%;border:0;background:none;cursor:pointer;text-align:left;
        padding:15px 17px;border-bottom:1px solid var(--line-2);transition:background .15s;}
    .row:last-child{border-bottom:0;}
    .row:hover{background:#f6f7f9;}
    .row:active{background:#eef0f3;}
    .row .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex-shrink:0;}
    .ic.red{background:var(--red-soft);color:var(--red);}
    .ic.amber{background:var(--amber-soft);color:var(--amber);}
    .ic.violet{background:var(--violet-soft);color:var(--violet);}
    .ic.teal{background:var(--teal-soft);color:var(--teal);}
    .ic.accent{background:var(--accent-soft);color:var(--accent);}
    .ic.green{background:var(--green-soft,#e6f3ec);color:var(--green);}
    .row .tx h3{margin:0;font-size:13.5px;font-weight:600;}
    .row .tx p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35;}
    .row .ch{margin-left:auto;color:#c4ccd6;font-size:13px;flex-shrink:0;}

    /* ============ SECTION CARDS (detalle) ============ */
    .section-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-card);margin-bottom:14px;overflow:hidden;}
    .section-card-header{padding:13px 17px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line-2);}
    .section-card-header.red{background:var(--red-soft);color:var(--red);}
    .section-card-header.accent{background:var(--accent-soft);color:var(--accent);}
    .section-card-header.amber{background:var(--amber-soft);color:var(--amber);}
    .section-card-header.violet{background:var(--violet-soft);color:var(--violet);}
    .section-card-header.teal{background:var(--teal-soft);color:var(--teal);}
    .section-card-header.gray{background:#f5f6f8;color:var(--muted);}
    .section-card-body{padding:15px 17px;font-size:13px;color:var(--muted);line-height:1.55;}
    .section-card-body strong{color:var(--ink);}
    .section-card-body p{margin:0 0 10px;}
    .section-card-body p:last-child{margin-bottom:0;}

    /* call buttons */
    .btn-call{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;
        color:#fff;text-align:center;font-weight:700;font-size:15px;border-radius:12px;text-decoration:none;
        margin-bottom:10px;transition:transform .12s,box-shadow .12s;}
    .btn-call:last-child{margin-bottom:0;}
    .btn-call:hover{transform:translateY(-1px);}
    .btn-call:active{transform:scale(.99);}
    .btn-call .n{font-variant-numeric:tabular-nums;}
    .btn-call.red{background:linear-gradient(180deg,var(--red),var(--red-dark));box-shadow:0 10px 20px -8px rgba(194,52,47,.5);}
    .btn-call.green{background:linear-gradient(180deg,var(--green),var(--green-dark));box-shadow:0 10px 20px -8px rgba(21,115,71,.5);}
    .btn-call.amber{background:linear-gradient(180deg,#c47812,#9a5a0c);box-shadow:0 10px 20px -8px rgba(180,105,14,.5);}
    .btn-call.dark{background:linear-gradient(180deg,#1f2937,#111827);box-shadow:0 10px 20px -8px rgba(0,0,0,.4);}

    /* check list */
    .check{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px;}
    .check:last-child{margin-bottom:0;}
    .check i{color:var(--green);margin-top:3px;flex-shrink:0;font-size:13px;}
    .check.info i{color:var(--accent);}
    .check span{font-size:13px;color:var(--muted);line-height:1.5;}
    .check span strong{color:var(--ink);}
    .note{font-size:11px;color:var(--faint);margin-top:12px;font-style:italic;line-height:1.5;}

    /* ============ AGENT CARD (contactos) ============ */
    .agent-card{background:linear-gradient(135deg,#0c2340 0%,#143055 60%,#0369a1 130%);color:#fff;border-radius:18px;
        padding:18px;margin-bottom:18px;box-shadow:0 16px 32px -14px rgba(12,35,64,.4);position:relative;overflow:hidden;}
    .agent-card::after{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;
        background:radial-gradient(closest-side,rgba(14,165,233,.4),transparent);pointer-events:none;}
    .agent-card .label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#93c5fd;margin-bottom:6px;}
    .agent-card .name{font-size:18px;font-weight:700;line-height:1.25;}
    .agent-card .meta{font-size:11.5px;color:rgba(255,255,255,.78);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;}
    .agent-card .meta span{display:inline-flex;align-items:center;gap:6px;}
    .agent-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px;position:relative;}
    .agent-action{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:11px;
        padding:11px 6px;font-size:11px;font-weight:600;text-align:center;text-decoration:none;
        display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .15s;}
    .agent-action:hover{background:rgba(255,255,255,.24);}
    .agent-action i{font-size:16px;}
    .agent-action.wa{background:linear-gradient(180deg,#25d366,#1da851);border-color:transparent;}
    .agent-action.wa:hover{background:linear-gradient(180deg,#2ee07a,#1da851);}

    .contact-tile{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);
        border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit;
        box-shadow:var(--shadow-card);transition:background .12s,border-color .12s;}
    .contact-tile:hover{background:#f6f7f9;border-color:#d8dde3;}
    .contact-tile h4{margin:0 0 2px;font-size:13.5px;font-weight:700;color:var(--ink);}
    .contact-tile p{margin:0;font-size:11px;color:var(--faint);}
    .contact-pill{background:var(--green-soft,#e6f3ec);color:var(--green);padding:6px 12px;border-radius:10px;
        font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;flex-shrink:0;}

    .office{margin-top:18px;background:#f5f6f8;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;font-size:12px;color:var(--muted);}
    .office i{font-size:20px;color:var(--faint);margin-bottom:8px;}
    .office a{color:var(--accent);font-weight:600;text-decoration:none;}

    /* ============ FOOTER ============ */
    .app-footer{margin-top:28px;padding:20px;}
    .footer-card{background:var(--navy);color:#cbd5e1;border-radius:20px;padding:24px 20px;text-align:center;}
    .footer-logo{height:46px;width:auto;display:block;margin:0 auto 16px;opacity:.95;}
    .footer-agent{background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.22);border-radius:14px;padding:13px 15px;max-width:340px;margin:0 auto 14px;}
    .footer-agent .label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#7dd3fc;font-weight:600;margin-bottom:5px;}
    .footer-agent .name{color:#fff;font-weight:700;font-size:14px;margin-bottom:2px;}
    .footer-agent .meta{color:#cbd5e1;font-size:11px;line-height:1.5;}
    .footer-link{color:#7dd3fc;font-weight:600;text-decoration:none;display:inline-block;margin-top:6px;}
    .footer-link:hover{text-decoration:underline;}
    .footer-brand{color:#fff;font-weight:700;}
    .footer-plataforma{font-size:12px;margin:6px 0 0;}
    .footer-legal{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:#94a3b8;line-height:1.5;max-width:340px;margin-left:auto;margin-right:auto;}

    @media (min-width:481px){
      .app{box-shadow:0 0 0 1px var(--line);min-height:100dvh;}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ---------- AGENTES (link fijo por agente con ?a=<id>) ---------- */
    const AGENTES = {
      jc: {
        name:'Juan Carlos Hernández Vargas', email:'jhernandez@segurosdelins.com',
        phone:'8822-1348', whatsapp:'50688221348', license:'08-1318', website:'www.segurosdelins.com'
      },
      fhv: {
        name:'Fernando Hernández Vargas', email:'fhernandez@segurosdelins.com',
        phone:'8526-3532', whatsapp:'50685263532', license:'08-1319', website:''
      }
    };
    const DEFAULT_AGENT_ID = 'jc';

    function getAgent(){
      try{
        const id = (new URLSearchParams(window.location.search).get('a') || DEFAULT_AGENT_ID).toLowerCase();
        return AGENTES[id] || AGENTES[DEFAULT_AGENT_ID];
      }catch(e){ return AGENTES[DEFAULT_AGENT_ID]; }
    }
    function initials(name){
      const p = (name||'').trim().split(/\s+/);
      return ((p[0]||'')[0] || '' ).concat((p[1]||'')[0] || '').toUpperCase() || 'SDI';
    }

    const BRAND = {
      empresa:'Seguros Digitales SDI®',
      legal:'© 2026 Propiedad Intelectual de Juan Carlos Hernández Vargas. Todos los derechos reservados.'
    };

    function App(){
      const [view, setView] = useState('home');
      const profile = getAgent();

      const titleByView = {
        accidente:'Reporte de Accidente', vial:'Asistencia Vial', robo:'Robo Total / Parcial',
        coberturaH:'Vandalismo / Naturaleza', contactos:'Directorio de Contactos'
      };
      const waNumber = (profile.whatsapp || profile.phone || '').replace(/\D/g,'');
      const waLink = waNumber ? `https://wa.me/${waNumber}` : null;

      return (
        <div className="app">
          <header className="app-header">
            <div className="header-inner">
              <div className="header-top">
                {view === 'home' ? (
                  <div className="brand">
                    <img src="ins-blanco.png" alt="INS" className="brand-logo"
                         onError={(e)=>{e.target.style.display='none';e.target.nextElementSibling.style.display='grid';}} />
                    <div className="brand-fallback" style={{display:'none'}}>INS</div>
                    <div className="brand-text">
                      <div className="brand-t1">Asistencia Autos</div>
                      <div className="brand-t2">Instituto Nacional de Seguros</div>
                    </div>
                  </div>
                ) : (
                  <button className="back-btn" onClick={()=>setView('home')} title="Volver">
                    <i className="fa-solid fa-chevron-left"></i>
                  </button>
                )}

                {view !== 'home' && <div className="detail-title">{titleByView[view]}</div>}

                <button className="hbtn" onClick={()=>setView('contactos')} title="Contactos">
                  <i className="fa-solid fa-phone"></i>
                </button>
              </div>

              {view === 'home' && (
                <React.Fragment>
                  <div className="greet">
                    <div className="k">Estamos contigo</div>
                    <h1>¿Qué pasó con<br/>tu vehículo?</h1>
                    <p>Elegí el tipo de asistencia y te guiamos paso a paso, en todo el país.</p>
                  </div>
                  <button className="agent-chip" onClick={()=>setView('contactos')}>
                    <div className="av">{initials(profile.name)}</div>
                    <div>
                      <div className="n">{profile.name}</div>
                      <div className="m">Tu agente · Licencia {profile.license}</div>
                    </div>
                    <i className="fa-solid fa-chevron-right go"></i>
                  </button>
                </React.Fragment>
              )}
            </div>
          </header>

          <main>
            {view === 'home' && <Home setView={setView} />}
            {view === 'accidente' && <Accidente />}
            {view === 'vial' && <Vial />}
            {view === 'robo' && <Robo />}
            {view === 'coberturaH' && <CoberturaH />}
            {view === 'contactos' && <Contactos profile={profile} waLink={waLink} />}
          </main>

          <footer className="app-footer">
            <div className="footer-card">
              <img src="sdi-logo-blanco.svg" alt="Seguros Digitales SDI" className="footer-logo" />
              <div className="footer-agent">
                <div className="label">Tu agente</div>
                <div className="name">{profile.name}</div>
                <div className="meta">Licencia {profile.license} · {profile.email}</div>
                {profile.website && (
                  <a href={profile.website.startsWith('http') ? profile.website : `https://${profile.website}`}
                     className="footer-link" target="_blank" rel="noopener noreferrer">
                    <i className="fa-solid fa-globe" style={{marginRight:5}}></i>{profile.website}
                  </a>
                )}
              </div>
              <p className="footer-plataforma">Plataforma de <span className="footer-brand">{BRAND.empresa}</span></p>
              <div className="footer-legal">{BRAND.legal}</div>
            </div>
          </footer>
        </div>
      );
    }

    function Home({ setView }){
      return (
        <div className="container">
          <button className="sos" onClick={()=>setView('accidente')}>
            <div className="ic"><i className="fa-solid fa-car-burst"></i></div>
            <div>
              <div className="ttl">Reportar accidente</div>
              <div className="sub">Línea INS 24/7 · choques y daños</div>
            </div>
            <div className="num">800-800-8000</div>
          </button>

          <div className="lbl">Tipos de asistencia</div>
          <div className="list">
            <button className="row" onClick={()=>setView('vial')}>
              <div className="ic amber"><i className="fa-solid fa-screwdriver-wrench"></i></div>
              <div className="tx"><h3>Asistencia vial (avería)</h3><p>Grúa, batería, llanta, cerrajería o aeropuerto.</p></div>
              <i className="fa-solid fa-chevron-right ch"></i>
            </button>
            <button className="row" onClick={()=>setView('robo')}>
              <div className="ic violet"><i className="fa-solid fa-shield-halved"></i></div>
              <div className="tx"><h3>Robo total o parcial</h3><p>Denuncia OIJ, traslados y trámites con el INS.</p></div>
              <i className="fa-solid fa-chevron-right ch"></i>
            </button>
            <button className="row" onClick={()=>setView('coberturaH')}>
              <div className="ic teal"><i className="fa-solid fa-cloud-showers-heavy"></i></div>
              <div className="tx"><h3>Vandalismo / Naturaleza</h3><p>Rayonazos, inundación, caída de árboles (Cobertura H).</p></div>
              <i className="fa-solid fa-chevron-right ch"></i>
            </button>
            <button className="row" onClick={()=>setView('contactos')}>
              <div className="ic accent"><i className="fa-solid fa-address-book"></i></div>
              <div className="tx"><h3>Directorio de contactos</h3><p>Tu agente y las líneas directas 24/7 del INS.</p></div>
              <i className="fa-solid fa-chevron-right ch"></i>
            </button>
          </div>
        </div>
      );
    }

    function Accidente(){
      return (
        <div className="container">
          <div className="section-card">
            <div className="section-card-header red"><i className="fa-solid fa-triangle-exclamation"></i> Paso 1: Reporte inmediato</div>
            <div className="section-card-body">
              <p>Si tuviste un choque, <strong>¡NO muevas el vehículo!</strong> (a menos que aplique el Pacto Amistoso). Llamá de inmediato:</p>
              <a href="tel:8008008000" className="btn-call red"><i className="fa-solid fa-phone"></i> <span className="n">800-800-8000</span> · Reporte</a>
            </div>
          </div>

          <div className="section-card">
            <div className="section-card-header accent"><i className="fa-solid fa-handshake-angle"></i> ¿Aplica el Pacto Amistoso?</div>
            <div className="section-card-body">
              <p>Podés mover el vehículo sin esperar al Tránsito SI se cumplen <strong>TODAS</strong>:</p>
