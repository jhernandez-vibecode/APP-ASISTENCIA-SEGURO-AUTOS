<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mockup A · Sereno · Asistencia Autos SDI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --navy:#0c2340; --navy-2:#143055;
    --ink:#1a2230; --muted:#5b6675; --faint:#8a93a0;
    --line:#e9ebef; --line-2:#f0f2f5;
    --paper:#fbfbfa; --card:#ffffff;
    --accent:#0369a1; --accent-soft:#eef6fb;
    --red:#c2342f; --red-soft:#fbeeed;
    --amber:#b4690e; --amber-soft:#fdf3e7;
    --violet:#5b4b8a; --violet-soft:#f1eef8;
    --teal:#0f6f63; --teal-soft:#e7f4f1;
    --green:#157347;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Sora',system-ui,sans-serif;background:#e7e9ec;color:var(--ink);
       display:flex;justify-content:center;padding:24px 0;min-height:100dvh;}
  .phone{width:100%;max-width:430px;background:var(--paper);border-radius:34px;overflow:hidden;
         box-shadow:0 30px 70px -20px rgba(12,35,64,.45),0 0 0 1px rgba(12,35,64,.05);}

  /* ribbon */
  .ribbon{background:#0c2340;color:#cfe3f5;text-align:center;font-size:10px;letter-spacing:1.5px;
          text-transform:uppercase;padding:6px;font-weight:600;}

  /* header */
  header{background:var(--navy);color:#fff;padding:18px 22px 22px;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand img{height:30px;width:auto;object-fit:contain;}
  .brand .fallback{height:30px;min-width:52px;border:1.5px solid #fff;border-radius:6px;
        display:grid;place-items:center;font-weight:800;letter-spacing:1.5px;font-size:13px;}
  .brand .t1{font-size:12.5px;font-weight:700;line-height:1.1;}
  .brand .t2{font-size:9.5px;opacity:.62;letter-spacing:.3px;margin-top:2px;}
  .hbtn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:0;color:#fff;
        display:grid;place-items:center;font-size:14px;}
  .greet{margin-top:20px;}
  .greet .k{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7fb0db;font-weight:600;}
  .greet h1{margin:7px 0 0;font-size:25px;line-height:1.1;font-weight:700;letter-spacing:-.5px;}
  .greet p{margin:8px 0 0;font-size:13px;line-height:1.5;color:#b9c8da;max-width:30ch;}

  /* agent chip */
  .agent{display:flex;align-items:center;gap:11px;margin-top:18px;padding:11px 13px;
         background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;}
  .agent .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#0369a1);
         display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .agent .n{font-size:12.5px;font-weight:600;line-height:1.2;}
  .agent .m{font-size:10.5px;color:#9fb4c9;margin-top:2px;}
  .agent .go{margin-left:auto;color:#7fb0db;font-size:13px;}

  /* body */
  main{padding:20px 22px 8px;}
  .lbl{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint);
       font-weight:600;margin:4px 4px 8px;}

  /* emergency banner */
  .sos{display:flex;align-items:center;gap:14px;width:100%;border:0;cursor:pointer;text-align:left;
       background:linear-gradient(180deg,#c2342f,#9f2722);color:#fff;border-radius:18px;padding:16px 18px;
       box-shadow:0 12px 24px -8px rgba(194,52,47,.5);margin-bottom:22px;}
  .sos .ic{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);
       display:grid;place-items:center;font-size:20px;flex-shrink:0;}
  .sos .ttl{font-size:15px;font-weight:700;}
  .sos .sub{font-size:11.5px;opacity:.82;margin-top:2px;}
  .sos .num{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
       background:rgba(255,255,255,.16);padding:6px 10px;border-radius:9px;}

  /* divided action list — no boxed cards */
  .list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
  .row{display:flex;align-items:center;gap:15px;width:100%;border:0;background:none;cursor:pointer;
       text-align:left;padding:15px 17px;border-bottom:1px solid var(--line-2);transition:background .15s;}
  .row:last-child{border-bottom:0;}
  .row:active{background:#f6f7f9;}
  .row .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex-shrink:0;}
  .ic.red{background:var(--red-soft);color:var(--red);}
  .ic.amber{background:var(--amber-soft);color:var(--amber);}
  .ic.violet{background:var(--violet-soft);color:var(--violet);}
  .ic.teal{background:var(--teal-soft);color:var(--teal);}
  .ic.accent{background:var(--accent-soft);color:var(--accent);}
  .row .tx h3{margin:0;font-size:13.5px;font-weight:600;}
  .row .tx p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35;}
  .row .ch{margin-left:auto;color:#c4ccd6;font-size:13px;}

  footer{padding:26px 22px 30px;text-align:center;}
  footer img{height:42px;opacity:.9;margin-bottom:12px;}
  footer .e{font-size:11px;color:var(--faint);}
  footer .e b{color:var(--muted);}

  /* === 100% responsive: en celular llena toda la pantalla === */
  @media (max-width:520px){
    body{padding:0;background:var(--paper);}
    .phone{max-width:100%;min-height:100dvh;border-radius:0;box-shadow:none;}
  }
</style>
</head>
<body>
<div class="phone">
  <div class="ribbon">Mockup A — Sereno</div>
  <header>
    <div class="top">
      <div class="brand">
        <img src="../ins-blanco.png" alt="INS" onerror="this.style.display='none';this.nextElementSibling.style.display='grid';">
        <div class="fallback" style="display:none">INS</div>
        <div>
          <div class="t1">Asistencia Autos</div>
          <div class="t2">Instituto Nacional de Seguros</div>
        </div>
      </div>
      <button class="hbtn"><i class="fa-solid fa-phone"></i></button>
    </div>

    <div class="greet">
      <div class="k">Estamos contigo</div>
      <h1>¿Qué pasó con<br>tu vehículo?</h1>
      <p>Elegí el tipo de asistencia y te guiamos paso a paso, en todo el país.</p>
    </div>

    <div class="agent">
      <div class="av">JC</div>
      <div>
        <div class="n">Juan Carlos Hernández</div>
        <div class="m">Tu agente · Licencia 08-1318</div>
      </div>
      <i class="fa-solid fa-chevron-right go"></i>
    </div>
  </header>

  <main>
    <button class="sos">
      <div class="ic"><i class="fa-solid fa-car-burst"></i></div>
      <div>
        <div class="ttl">Reportar accidente ahora</div>
        <div class="sub">Línea INS 24/7 · choques y daños</div>
      </div>
      <div class="num">800-800-8000</div>
    </button>

    <div class="lbl">Tipos de asistencia</div>
    <div class="list">
      <button class="row">
        <div class="ic accent"><i class="fa-solid fa-handshake-angle"></i></div>
        <div class="tx"><h3>Pacto Amistoso</h3><p>¿Podés mover el vehículo? Verificá los 4 requisitos.</p></div>
        <i class="fa-solid fa-chevron-right ch"></i>
      </button>
      <button class="row">
        <div class="ic amber"><i class="fa-solid fa-screwdriver-wrench"></i></div>
        <div class="tx"><h3>Asistencia vial (avería)</h3><p>Grúa, batería, llanta, cerrajería o aeropuerto.</p></div>
        <i class="fa-solid fa-chevron-right ch"></i>
      </button>
      <button class="row">
        <div class="ic violet"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="tx"><h3>Robo total o parcial</h3><p>Denuncia OIJ, traslados y trámites con el INS.</p></div>
        <i class="fa-solid fa-chevron-right ch"></i>
      </button>
      <button class="row">
        <div class="ic teal"><i class="fa-solid fa-cloud-showers-heavy"></i></div>
        <div class="tx"><h3>Vandalismo / Naturaleza</h3><p>Rayonazos, inundación, caída de árboles (Cobertura H).</p></div>
        <i class="fa-solid fa-chevron-right ch"></i>
      </button>
      <button class="row">
        <div class="ic red"><i class="fa-solid fa-address-book"></i></div>
        <div class="tx"><h3>Directorio de contactos</h3><p>Tu agente y las líneas directas 24/7 del INS.</p></div>
        <i class="fa-solid fa-chevron-right ch"></i>
      </button>
    </div>
  </main>

  <footer>
    <img src="../sdi-logo-blanco.svg" alt="SDI" style="filter:brightness(0) saturate(100%) invert(13%) sepia(38%) saturate(1400%) hue-rotate(184deg);opacity:.55">
    <div class="e">Plataforma de <b>Seguros Digitales SDI®</b></div>
  </footer>
</div>
</body>
</html>
